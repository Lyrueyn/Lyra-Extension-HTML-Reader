<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 阅读器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo">HTML</span>
        <div class="titles">
          <div id="fileName" class="file-name">未命名.html</div>
          <div id="filePath" class="file-path"></div>
        </div>
      </div>
      <div class="toolbar">
        <div class="mode-switch">
          <button id="readModeBtn" class="mode active" type="button">阅读</button>
          <button id="editModeBtn" class="mode" type="button">编辑</button>
        </div>
        <span id="status" class="status">就绪</span>
          <button id="projectBtn" class="ghost" type="button" hidden>项目</button>
          <button id="tocBtn" class="ghost" type="button" hidden>目录</button>
        <button id="saveBtn" class="ghost" type="button">保存</button>
      </div>
    </header>
    <main class="content">
      <aside id="projectPanel" class="project-panel" hidden>
        <div class="project-head"><span id="projectTitle">项目</span><button id="projectCloseBtn" class="toc-close" type="button" title="关闭">×</button></div>
        <div id="projectList" class="project-list"></div>
      </aside>
      <iframe id="readFrame" class="frame" title="HTML 阅读" allow="autoplay" sandbox="allow-same-origin allow-scripts allow-forms allow-modals"></iframe>
      <iframe id="editFrame" class="frame editor-frame" title="HTML 编辑器" allow="autoplay" hidden></iframe>
        <div id="readProgress" class="read-progress" hidden><div id="readProgressFill"></div></div>
        <div id="findBar" class="find-bar" hidden>
          <input id="findInput" type="text" placeholder="页内查找…" spellcheck="false" autocomplete="off"/>
          <span id="findCount" class="find-count">0/0</span>
          <button id="findPrev" type="button" title="上一个">↑</button>
          <button id="findNext" type="button" title="下一个">↓</button>
          <button id="findClose" type="button" title="关闭">×</button>
        </div>
        <aside id="tocPanel" class="toc-panel" hidden>
          <div class="toc-head"><span id="tocTitle">目录</span><button id="tocCloseBtn" class="toc-close" type="button" title="关闭">×</button></div>
          <div id="tocList" class="toc-list"></div>
        </aside>
    </main>
  </div>
  <div id="errorMask" class="error-mask" hidden>
    <div class="error-card">
      <h3>HTML 阅读器无法打开</h3>
      <p id="errorText"></p>
      <button id="errorClose" type="button" class="ghost">关闭</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
